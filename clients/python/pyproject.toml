[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-ai-sdk"
version = "0.5.0"
description = "Run Astra-compressed models on-device with local ONNX serving and built-in closed-loop telemetry that feeds the Astra dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Astra" }]
keywords = ["onnx", "model-compression", "inference", "telemetry", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The SDK is on-device only — running a model is its whole purpose — so the ONNX
# runtime + numpy are CORE deps, not an opt-in extra. `pip install astra-ai-sdk`
# is all you need to pull, run, and ship telemetry.
dependencies = ["httpx>=0.27", "onnxruntime>=1.18", "numpy>=1.26"]

[project.optional-dependencies]
# `serve` used to add onnxruntime+numpy back when a lighter hosted-only install
# existed; those are core now, so it's an empty back-compat alias — an existing
# `pip install 'astra-ai-sdk[serve]'` still works without a warning.
serve = []
system = ["psutil>=5.9"]        # finer host CPU%/RSS telemetry (has fallbacks without it)
gpu = ["nvidia-ml-py>=12"]      # NVIDIA GPU telemetry (util/mem/temp); NVIDIA-only
dev = ["pytest>=8.0", "onnx>=1.16"]

[project.urls]
Homepage = "https://github.com/AstraFoundation/Astra-Back"
Documentation = "https://github.com/AstraFoundation/Astra-Back#readme"
Changelog = "https://github.com/AstraFoundation/Astra-Back/blob/main/clients/python/CHANGELOG.md"

[project.scripts]
astra = "astra_sdk.cli:main"

[tool.setuptools]
packages = ["astra_sdk"]

[tool.setuptools.package-data]
astra_sdk = ["py.typed"]
